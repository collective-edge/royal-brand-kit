<!-- Royal Ambulance header band · house type system v1.0.
     Drop this at the top of any one-pager, report or letterhead.
     Edit the title text. Both stylesheets must load first.
     .bk-on-dark drops the title one weight and opens its tracking. -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/collective-edge/collective-edge-brand-kit@main/snippets/type-system.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/collective-edge/royal-brand-kit@main/snippets/palette.css">

<header class="bk-on-dark" style="background:var(--bg-band); display:flex; align-items:center; justify-content:space-between; gap:var(--space-6); padding:var(--space-6) 0.5in;">
  <div class="bk-h2 bk-caps" style="margin:0;">
    Document title
  </div>
  <img
    src="https://cdn.jsdelivr.net/gh/collective-edge/royal-brand-kit@main/assets/logos/horizontal-white.svg"
    alt="Royal Ambulance"
    style="width:1.6in; height:auto; display:block; flex:none;"
  />
</header>

<!-- Slide or title surface: swap class="bk-h2" for class="bk-display-md".
     .bk-caps carries the uppercase and the caps tracking at whatever step it
     sits on, and .bk-on-dark adds the 0.005em bonus through --tr-dark.
     Display resolves to 700 on a dark ground, never 800. -->
